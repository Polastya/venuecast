<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chor Police ₹500 Bachao</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:#fff;font-family:system-ui,Segoe UI,sans-serif}
#wrap{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#0b1730,#07101b)}canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:2}.pill{background:#101b2ddd;border:1px solid #ffffff16;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:900}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#02060b77,#02060bdd);z-index:5}.card{max-width:390px;width:100%;padding:25px;border-radius:24px;background:#101b2df2;border:1px solid #ffffff18;text-align:center;box-shadow:0 25px 80px #0008}.hero{font-size:43px}.title{font-size:36px;line-height:1;margin:6px 0 8px;font-weight:950}.sub{font-size:14px;line-height:1.45;color:#9fb0c8}.cash{color:#ffd44d;font-size:52px;font-weight:950;margin:10px}.btn{width:100%;padding:15px;border:0;border-radius:15px;background:#ffd44d;color:#171b20;font-size:17px;font-weight:950;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.stat{background:#0c1626;padding:12px;border-radius:14px;border:1px solid #ffffff0d}.small{font-size:11px;color:#9fb0c8;text-transform:uppercase}.big{font-size:22px;font-weight:900;margin-top:2px}.hidden{display:none!important}#tip{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:#a7b6ca;z-index:3;pointer-events:none}
</style></head>
<body><div id="wrap"><canvas id="c"></canvas>
<div class="hud"><div class="pill">💰 ₹<b id="score">0</b></div><div class="pill">🪙 <b id="coins">0</b></div><div class="pill">🔥 x<b id="combo">1</b></div></div><div id="tip">TAP = JUMP • NEAR MISS = BIG BONUS</div>
<div id="panel"><div class="card"><div class="hero">🏃‍♂️💨🚔</div><div class="title">Chor Police</div><div class="sub">Police se bachao. ₹500 sambhalo. Har second speed badhegi.<br><b>Bas ek aur try… 😈</b></div><div class="cash">₹500</div><button class="btn" id="start">START RUN</button><div class="stats"><div class="stat"><div class="small">Best</div><div class="big" id="best">0</div></div><div class="stat"><div class="small">Bank</div><div class="big">₹<span id="bank">0</span></div></div></div></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1,g=0,run=false,dead=false,last=0,spawn=0,cspawn=.3,spd=470,score=500,coins=0,combo=1,best=+localStorage.best500||0,bank=+localStorage.bank500||0;const p={x:64,y:0,w:38,h:54,vy:0,ground:true},obs=[],cs=[],fx=[];
function fit(){d=Math.min(devicePixelRatio||1,2);W=innerWidth*d;H=innerHeight*d;c.width=W;c.height=H;g=H*.8;p.y=g-p.h*d}addEventListener('resize',fit);fit();
function hud(){scoreEl.textContent=Math.floor(score);coinsEl.textContent=coins;comboEl.textContent=combo;bestEl.textContent=best;bankEl.textContent=bank}const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),comboEl=document.getElementById('combo'),bestEl=document.getElementById('best'),bankEl=document.getElementById('bank');
function start(){run=true;dead=false;score=500;coins=0;combo=1;spd=470*d;spawn=.2;cspawn=.3;obs.length=0;cs.length=0;fx.length=0;p.y=g-p.h*d;p.vy=0;p.ground=true;document.getElementById('panel').classList.add('hidden');hud()}
function jump(){if(!run)return;if(p.ground){p.vy=-920*d;p.ground=false;burst(p.x+20*d,p.y+p.h*d,7,'#ffd44d')}}
function addO(){let h=(50+Math.random()*55)*d,w=(36+Math.random()*18)*d;obs.push({x:W+20*d,y:g-h,w,h,near:0,passed:0})}
function addC(){cs.push({x:W+15*d,y:g-(100+Math.random()*180)*d,r:10*d})}
function burst(xx,yy,n,col){for(let i=0;i<n;i++)fx.push({x:xx,y:yy,vx:(Math.random()-.5)*280*d,vy:(Math.random()-.7)*300*d,a:1,col})}
function update(dt){if(!run)return;spd+=11*d*dt;score+=6*dt*spd/d;spawn-=dt;cspawn-=dt;if(spawn<0){addO();spawn=Math.max(.52,.95-Math.min((spd/d-470)/1800,.32)+Math.random()*.55)}if(cspawn<0){addC();cspawn=.45+Math.random()*.7}
p.vy+=2300*d*dt;p.y+=p.vy*dt;if(p.y>=g-p.h*d){p.y=g-p.h*d;p.vy=0;p.ground=true}
for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=spd*dt;let hit=p.x+p.w*d-6*d>o.x&&p.x+6*d<o.x+o.w&&p.y+p.h*d-7*d>o.y&&p.y+8*d<o.y+o.h;if(hit){end();return}
if(!o.passed&&o.x+o.w<p.x){o.passed=1;combo=Math.min(12,combo+1);score+=25*combo;bank+=10;localStorage.bank500=bank;burst(o.x,o.y,8,'#72e0a1')}
let near=Math.abs(o.x-(p.x+p.w*d));if(!o.near&&near<26*d&&o.x>p.x+p.w*d){o.near=1;score+=50*combo;burst(p.x+p.w*d,p.y+p.h*d/2,18,'#ffd44d')}
if(o.x+o.w<-30*d)obs.splice(i,1)}
for(let i=cs.length-1;i>=0;i--){let q=cs[i];q.x-=spd*dt;if(Math.hypot(q.x-(p.x+p.w*d/2),q.y-(p.y+p.h*d/2))<28*d){coins++;score+=15*combo;burst(q.x,q.y,12,'#ffd44d');cs.splice(i,1)}else if(q.x<-20*d)cs.splice(i,1)}
for(let i=fx.length-1;i>=0;i--){let z=fx[i];z.x+=z.vx*dt;z.y+=z.vy*dt;z.vy+=900*d*dt;z.a-=dt*1.8;if(z.a<=0)fx.splice(i,1)}hud()}
function end(){run=false;dead=true;best=Math.max(best,Math.floor(score));localStorage.best500=best;document.getElementById('panel').classList.remove('hidden');document.getElementById('start').textContent='RUN IT BACK';document.querySelector('.cash').textContent='₹'+Math.floor(score);document.querySelector('.sub').innerHTML='<b>Police pakad leti… 😂</b><br>Tum ₹'+Math.floor(score)+' lekar bhaage.';hud()}
function draw(){x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1830');bg.addColorStop(1,'#07101b');x.fillStyle=bg;x.fillRect(0,0,W,H);x.fillStyle='#101e34';x.fillRect(0,g,W,H-g);x.fillStyle='#1f3351';x.fillRect(0,g,W,8*d);for(let i=0;i<11;i++){let bx=i*90*d-(Date.now()/12%(90*d));x.fillStyle='#ffffff09';x.fillRect(bx,g-55*d,55*d,55*d)}
cs.forEach(q=>{x.fillStyle='#ffd44d';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.fillStyle='#6e5410';x.font=14*d+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('₹',q.x,q.y+1*d)});
obs.forEach(o=>{x.fillStyle='#eef2f6';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#e63946';x.fillRect(o.x,o.y+o.h*.55,o.w,o.h*.12);x.font=15*d+'px sans-serif';x.textAlign='center';x.fillStyle='#1b2942';x.fillText('🚧',o.x+o.w/2,o.y+o.h/2)});
x.save();x.translate(p.x,p.y);x.fillStyle='#ffcc66';x.beginPath();x.arc(19*d,12*d,11*d,0,7);x.fill();x.fillStyle='#332718';x.fillRect(8*d,0,22*d,7*d);x.fillStyle='#2ea3ff';x.fillRect(7*d,22*d,24*d,28*d);x.fillStyle='#f0f3f7';x.fillRect(7*d,50*d,9*d,4*d);x.fillRect(22*d,50*d,9*d,4*d);x.restore();
fx.forEach(z=>{x.globalAlpha=z.a;x.fillStyle=z.col;x.fillRect(z.x,z.y,5*d,5*d)});x.globalAlpha=1;requestAnimationFrame(draw)}
document.getElementById('start').onclick=start;addEventListener('pointerdown',e=>{if(!e.target.closest('button'))jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});hud();requestAnimationFrame(draw);function loop(t){let dt=last?Math.min(.033,(t-last)/1000):0;last=t;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
